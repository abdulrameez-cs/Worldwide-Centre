.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
button{font:inherit;cursor:pointer}

body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;font-size:14px}
:root{--bg:#f2f4f8;--bd:#e2e6ee;--ac:#e8851a;--sh:0 1px 2px rgba(20,48,95,.06),0 4px 14px rgba(20,48,95,.05)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e121c;--card:#161c2a;--bd:#262e42;--sh:none}}
:root[data-theme="dark"]{--bg:#0e121c;--card:#161c2a;--bd:#262e42;--sh:none}
header{padding:12px 16px;background:#14305f;border-radius:0;border-bottom:3px solid var(--ac);box-shadow:none}
.logo{width:46px;height:46px;border-radius:12px;padding:2px;box-shadow:none}.logo img{border-radius:10px}

.pt{padding:18px 16px 2px}.pt h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}.pt p{margin:3px 0 0;color:var(--mu);font-size:13px}
main{padding:12px 12px 120px}
.card{border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh)}
label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:600;margin:10px 0 4px}
input,select{border:1px solid var(--bd);border-radius:10px;padding:11px 12px;background:var(--card)}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 18%,transparent)}
input[readonly]{background:var(--bg);color:var(--mu)}
.pri{background:var(--pr);box-shadow:none;border-radius:10px;padding:11px 20px}
.sec{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px}
.dng{border:1px solid color-mix(in srgb,var(--no) 35%,var(--bd));border-radius:10px}
nav{border-radius:0;border-top:1px solid var(--bd);box-shadow:0 -2px 12px rgba(20,48,95,.07);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{position:relative;border-radius:10px;font-weight:500;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:transparent;color:var(--pr);font-weight:700}
nav button.on::before{content:"";position:absolute;top:-7px;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--ac)}
.item{border:1px solid var(--bd);border-radius:12px;box-shadow:none}
.av{width:40px;height:40px;font-size:13px}
.pa{gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.pa button{border:0;border-radius:0;width:46px;height:38px;background:var(--card);box-shadow:none!important}
.pa button+button{border-left:1px solid var(--bd)}
.pa .on.p{background:var(--ok);color:#fff}.pa .on.a{background:var(--no);color:#fff}
.st{border:1px solid var(--bd);box-shadow:none;border-radius:12px;text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.st b{font-size:22px;text-transform:none;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar b{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--pr)}
table{font-variant-numeric:tabular-nums}td,th{padding:9px 8px}th{background:var(--bg)}tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:10px;color:var(--tx)}.chip button{color:var(--mu)}
#toast{background:#14305f;border-radius:10px}
.warn{background:color-mix(in srgb,var(--ac) 14%,var(--card));border:1px solid color-mix(in srgb,var(--ac) 45%,var(--bd));border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:13px;cursor:pointer}
.hint{color:var(--mu);font-size:13px;margin:6px 0 12px}
.bd{min-width:46px;text-align:center;font-size:11px;font-weight:700;padding:4px 6px;border-radius:8px;text-transform:uppercase}
.bd.p{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}.bd.f{background:color-mix(in srgb,var(--no) 16%,transparent);color:var(--no)}.bd.i{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac)}
.mi{width:74px;text-align:center;font-weight:600;padding:9px 4px}
.rk1{background:linear-gradient(135deg,#f6c945,#e3a008)!important;color:#5a3d00!important}
.rk2{background:linear-gradient(135deg,#dfe3ea,#aeb6c4)!important;color:#2f3744!important}
.rk3{background:linear-gradient(135deg,#eab183,#c47a3c)!important;color:#4a2608!important}
.av[class*=rk]{font-weight:800;font-size:16px}
.item.top{border-color:color-mix(in srgb,var(--ac) 55%,var(--bd));background:color-mix(in srgb,var(--ac) 7%,var(--card))}
.pod{border-color:color-mix(in srgb,var(--ac) 50%,var(--bd))}.pr{display:flex;align-items:center;gap:12px;padding:8px 0 0;margin-top:8px;border-top:1px solid var(--bd)}.pr>b{font-variant-numeric:tabular-nums}

const SV={att:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>',stu:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 010 6.4M18 14.4c2 .7 3.5 2.6 3.5 5.6"/></svg>',rep:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',mk:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',set:'<svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'};
const ini=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const col=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 50% 92%);color:hsl(${h} 55% 30%)`};
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2500)}
function opts(list,sel,all){return (all?'<option value="">All '+all+'</option>':'<option value="">Select…</option>')+list.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
const sr=s=>S.students.filter(x=>x.batch===s.batch).findIndex(x=>x.id===s.id)+1;
const cur=()=>S.students.find(s=>s.id===editId);
const fs=b=>S.students.filter(s=>!b||s.batch===b).sort((p,q)=>S.batches.indexOf(p.batch)-S.batches.indexOf(q.batch));
function go(t){tab=t;pend=null;render()}
function render(){$('nav').innerHTML=TABS.map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="go('${k}')">${SV[k]}<span>${v}</span></button>`).join('');({att:vAtt,stu:vStu,rep:vRep,mk:vMk,set:vSet})[tab]();const t=PT[tab];$('pt').innerHTML=`<div class=pt><h2>${t[0]}</h2><p>${t[1]}</p></div>`}

/* ---- Attendance ---- */
function vAtt(){const f=F.att;
$('main').innerHTML=bk()+`<div class=card><label>Date</label><input type=date value="${f.date}" onchange="F.att.date=this.value||today();vAttList()">
<label>Batch</label><select onchange="F.att.bat=this.value;vAttList()">${opts(S.batches,f.bat,'batches')}</select></div><div id=alist></div>`;vAttList()}
function vAttList(){const f=F.att,list=fs(f.bat),day=S.att[f.date]||{};
const p=list.filter(s=>day[s.id]==='P').length,a=list.filter(s=>day[s.id]==='A').length;
$('alist').innerHTML=list.length?`<div class=stats><div class="st g"><b>${p}</b>Present</div><div class="st r"><b>${a}</b>Absent</div><div class=st><b>${list.length-p-a}</b>Unmarked</div></div><div class=bar><span>${list.length} students</span><button class=sec onclick="allP()">✓ All Present</button></div>`+
list.map(s=>`<div class=item><div class=av style="background:${col(s.name)}">${ini(s.name)}</div><div class=nm>${esc(s.name)}<small>#${sr(s)} · Roll ${esc(s.roll||'-')} · ${esc(s.batch)}</small></div><div class=pa><button class="${day[s.id]==='P'?'on p':''}" onclick="mark('${s.id}','P')">P</button><button class="${day[s.id]==='A'?'on a':''}" onclick="mark('${s.id}','A')">A</button></div></div>`).join(''):'<p class=empty>No students here yet. Add them in the Students tab.</p>'}
function mark(id,v){const d=F.att.date;S.att[d]=S.att[d]||{};if(S.att[d][id]===v)delete S.att[d][id];else S.att[d][id]=v;if(!Object.keys(S.att[d]).length)delete S.att[d];save();vAttList()}
function allP(){const d=F.att.date;S.att[d]=S.att[d]||{};fs(F.att.bat).forEach(s=>S.att[d][s.id]='P');save();vAttList()}

/* ---- Students ---- */
function vStu(){const e=S.students.find(s=>s.id===editId)||{};
$('main').innerHTML=`<div class=card><b>${editId?'Edit student':'Add student'}</b>
<label>Batch *</label><select id=sb onchange="F.sb=this.value;updSr()">${opts(S.batches,e.batch||F.sb)}</select>
<div class=row><div><label>Serial No (auto)</label><input id=ssr readonly></div><div><label>Roll No *</label><input id=sroll value="${esc(e.roll)}"></div></div>
<label>Name *</label><input id=sn value="${esc(e.name)}"><label>Father's Name</label><input id=sf value="${esc(e.father)}">

<div class=row style="margin-top:10px"><button class=pri onclick="saveStu()">${editId?'Update':'Add'}</button>${editId?'<button class=sec onclick="editId=null;vStu()">Cancel</button>':''}</div></div>
<input placeholder="Search student…" value="${esc(F.q)}" oninput="F.q=this.value;vStuList()" style="margin-bottom:10px"><div id=slist></div>`;vStuList();updSr()}
function updSr(){const b=$('sb').value,c=cur();$('ssr').value=!b?'-':(c&&c.batch===b)?sr(c):S.students.filter(s=>s.batch===b).length+1}
function vStuList(){const q=F.q.toLowerCase(),list=S.students.filter(s=>(s.name+' '+(s.father||'')+' '+(s.roll||'')).toLowerCase().includes(q)).sort((p,q)=>S.batches.indexOf(p.batch)-S.batches.indexOf(q.batch));
let h='',last='';list.forEach(s=>{if(s.batch!==last){last=s.batch;h+=`<div class=bar><b>${esc(s.batch)}</b></div>`}
h+=`<div class=item><div class=av style="background:${col(s.name)}">${ini(s.name)}</div><div class=nm>${esc(s.name)}<small>#${sr(s)} · Roll ${esc(s.roll||'-')}${s.father?' · Father: '+esc(s.father):''}</small></div><div class=acts><button class=sec onclick="editId='${s.id}';vStu();scrollTo(0,0)">Edit</button><button class=dng onclick="delStu('${s.id}')">${pend===s.id?'Sure?':'Delete'}</button></div></div>`});
$('slist').innerHTML=h||'<p class=empty>No students yet.</p>'}
function saveStu(){const v=id=>$(id).value.trim(),n=v('sn'),b=v('sb'),rl=v('sroll');if(!n||!b||!rl)return toast('Batch, Roll No and Name are required');
if(S.students.some(s=>s.id!==editId&&s.batch===b&&s.roll===rl))return toast('Roll No already used in this batch');F.sb=b;
const d={name:n,father:v('sf'),roll:rl,batch:b};
if(editId)Object.assign(S.students.find(s=>s.id===editId),d);else S.students.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),...d});
editId=null;save();toast('Saved');vStu()}
function delStu(id){if(pend!==id){pend=id;vStuList();setTimeout(()=>{if(pend===id){pend=null;vStuList()}},3000);return}
S.students=S.students.filter(s=>s.id!==id);S.exams.forEach(x=>delete x.marks[id]);for(const d in S.att){delete S.att[d][id];if(!Object.keys(S.att[d]).length)delete S.att[d]}pend=null;save();vStuList()}

/* ---- Report ---- */
function calc(f){return fs(f.bat).map(s=>{let t=0,a=0;for(const d in S.att){if(f.from&&d<f.from)continue;if(f.to&&d>f.to)continue;const m=S.att[d][s.id];if(m){t++;if(m==='P')a++}}return{...s,t,a,pc:t?Math.round(a/t*1000)/10:0}})}
function vRep(){const f=F.rep;
$('main').innerHTML=`<div class=card><label>Batch</label><select onchange="F.rep.bat=this.value;vRepTbl()">${opts(S.batches,f.bat,'batches')}</select>
<div class=row><div><label>From</label><input type=date value="${f.from}" onchange="F.rep.from=this.value;vRepTbl()"></div><div><label>To</label><input type=date value="${f.to}" onchange="F.rep.to=this.value;vRepTbl()"></div></div>
<div style="margin-top:10px"><button class=pri onclick="pdf()">📄 Download PDF</button></div></div><div class=card><div class=tw id=rt></div></div>`;vRepTbl()}
function vRepTbl(){const r=calc(F.rep);$('rt').innerHTML=r.length?`<div class=stats><div class="st"><b>${r.length}</b>Students</div><div class="st g"><b>${Math.round(r.reduce((x,s)=>x+s.pc,0)/r.length*10)/10}%</b>Average</div><div class="st r"><b>${r.filter(s=>s.t&&s.pc<75).length}</b>Below 75%</div></div><table><tr><th>Sr</th><th>Roll</th><th>Name</th><th>Father</th><th class=r>Total</th><th class=r>Attended</th><th class=r>%</th></tr>`+r.map((s,i)=>`<tr><td>${sr(s)}</td><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.father)}</td><td class=r>${s.t}</td><td class=r>${s.a}</td><td class=r><span class="${s.t&&s.pc<75?'low':''}">${s.pc}%</span><div class=pb><i style="width:${s.pc}%;background:${s.pc<75?'var(--no)':'var(--ok)'}"></i></div></td></tr>`).join('')+'</table>':'<p class=empty>No students match.</p>'}
async function pdf(){const f=F.rep,rows=calc(f);if(!rows.length)return toast('No students to export');
if(!window.jspdf)return toast('PDF library did not load');
const avg=Math.round(rows.reduce((a,s)=>a+s.pc,0)/rows.length*10)/10,low=rows.filter(s=>s.t&&s.pc<75).length;
const p=new window.jspdf.jsPDF();let y=pdfHead(p,'Attendance Report');
y=infoBox(p,y,[['Batch',f.bat||'All batches'],['From',f.from||'Start'],['To',f.to||today()]],[['Students',rows.length],['Date',today()]]);
y=table2(p,y+6,[{h:'Sr',w:10,a:'c'},{h:'Roll No',w:28,a:'c',wrap:1},{h:'Name',w:44,wrap:1},{h:"Father's Name",w:36,wrap:1},{h:'Batch',w:16,a:'c'},{h:'Total',w:14,a:'c'},{h:'Attended',w:18,a:'c'},{h:'%',w:16,a:'c',cf:t=>t==='-'?null:parseFloat(t)<75?[201,58,58]:[26,138,74]}],rows.map(s=>[sr(s),s.roll||'-',s.name,s.father||'-',s.batch,s.t,s.a,s.t?s.pc+'%':'-']));
y=tiles(p,y+8,[{l:'STUDENTS',v:rows.length},{l:'AVERAGE ATTENDANCE',v:avg+'%'},{l:'BELOW 75%',v:low,c:[201,58,58]}]);
sign(p,y);foot(p);await savePdf(p,`WWC-attendance-${f.bat||'all'}-${today()}.pdf`.replace(/\s+/g,'_'))}

/* ---- Setup ---- */
function vSet(){const sec=(k,t)=>`<div class=card><b>${t}</b><div style="margin:8px 0">${S[k].map((x,i)=>`<span class=chip>${esc(x)}<button onclick="delItem('${k}',${i})">${pend===k+i?'Sure?':'✕'}</button></span>`).join('')||'<span class=empty>None</span>'}</div>
<div class=row><input id="n_${k}" placeholder="New ${t.toLowerCase().slice(0,-1)} name"><button class=pri style="flex:0 0 auto" onclick="addItem('${k}')">Add</button></div></div>`;
$('main').innerHTML=sec('batches','Batches')+bkCard()}
/* ---- Marks ---- */
const stat=(x,v)=>v==null?'':v>x.total?'Check':v>=x.pass?'Pass':'Fail';
const bcls={Pass:'p',Fail:'f',Check:'i'};
function ranks(x,b){const l=fs(b).filter(s=>stat(x,x.marks[s.id])==='Pass'),v=[...new Set(l.map(s=>x.marks[s.id]))].sort((p,q)=>q-p),r={};l.forEach(s=>r[s.id]=v.indexOf(x.marks[s.id])+1);return r}
function vMk(){const m=F.mk;if(m.ex)return vExam();if(m.st)return vSheet();
const courses=[...new Set(S.exams.map(x=>x.course))].filter(c=>c!=='Presentation');
let h=`<div class=card><b>Create test</b><label>Course name</label><input id=ec list=cl placeholder="e.g. DIT, CIT, Presentation"><datalist id=cl>${['Presentation',...courses].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label>Test name</label><input id=et placeholder="e.g. Mid-term, Final, Test 1"><div class=row><div><label>Passing marks</label><input id=epm type=number inputmode=decimal></div><div><label>Total marks</label><input id=etm type=number inputmode=decimal></div></div><div style="margin-top:12px"><button class=pri onclick="addEx()">Create test</button></div></div>`;
const ex=[...S.exams].sort((p,q)=>p.course.localeCompare(q.course));let last='';
h+=`<div class=bar><span>Your tests - tap one to enter marks</span></div>`+(ex.length?'':'<p class=empty>No tests yet. Create your first test above.</p>');
ex.forEach(x=>{if(x.course!==last){last=x.course;h+=`<div class=bar><b>${esc(x.course)}</b></div>`}
h+=`<div class=item onclick="openEx('${x.id}')" style="cursor:pointer"><div class=nm>${esc(x.title)}<small>Total ${x.total} · Pass ${x.pass} · ${Object.keys(x.marks).length} students entered</small></div><span class=hint style="margin:0">Open ›</span></div>`});
const b=m.bat;
h+=`<div class=card style="margin-top:14px"><b>Student marksheet</b><label>Batch</label><select onchange="F.mk.bat=this.value;vMk()">${opts(S.batches,b)}</select><label>Student</label><select id=sst>${b&&fs(b).length?fs(b).map(s=>`<option value="${s.id}">${esc(s.name)} (Roll ${esc(s.roll||'-')})</option>`).join(''):'<option value="">Select a batch with students</option>'}</select><div style="margin-top:12px"><button class=pri onclick="openSt()">View marksheet</button></div></div>`;
$('main').innerHTML=h}
function openEx(id){F.mk.ex=id;pend=null;vMk();scrollTo(0,0)}
function addEx(){let c=$('ec').value.trim();const t=$('et').value.trim(),tot=parseFloat($('etm').value),ps=parseFloat($('epm').value);
if(!c)return toast('Enter course name');if(!(tot>0))return toast('Enter total marks');if(isNaN(ps)||ps<0||ps>tot)return toast('Passing marks cannot be more than total');
const o=S.exams.find(e=>e.course.toLowerCase()===c.toLowerCase());if(o)c=o.course;
const x={id:'e'+Date.now().toString(36),course:c,title:t||c+' Test',total:tot,pass:ps,marks:{}};
S.exams.push(x);save();F.mk.ex=x.id;vMk();scrollTo(0,0)}
function vExam(){const x=S.exams.find(e=>e.id===F.mk.ex);if(!x){F.mk.ex=null;return vMk()}
$('main').innerHTML=`<button class=sec onclick="F.mk.ex=null;pend=null;vMk()">‹ Back</button><div class=card style="margin-top:10px"><label style="margin-top:0">Course name</label><input value="${esc(x.course)}" onchange="setEx('course',this.value)"><label>Test name</label><input value="${esc(x.title)}" onchange="setEx('title',this.value)"><div class=row><div><label>Passing marks</label><input type=number inputmode=decimal value="${x.pass}" onchange="setEx('pass',this.value)"></div><div><label>Total marks</label><input type=number inputmode=decimal value="${x.total}" onchange="setEx('total',this.value)"></div></div><div style="margin-top:12px"><button class=dng onclick="delEx()">${pend==='x'?'Sure? Tap again':'Delete test'}</button></div></div>
<div class=card><label style="margin-top:0">Choose batch to enter marks</label><select onchange="F.mk.bat=this.value;vExam()">${opts(S.batches,F.mk.bat)}</select>${F.mk.bat?`<div style="margin-top:12px"><button class=sec onclick="resPdf()">Download result PDF</button></div>`:''}</div><div id=ms></div><div id=tp></div><div id=ml></div>`;vML()}
function vML(){const x=S.exams.find(e=>e.id===F.mk.ex),b=F.mk.bat;
if(!b){$('ms').innerHTML='';$('tp').innerHTML='';$('ml').innerHTML='<p class=empty>Choose a batch to see its students.</p>';return}
const list=fs(b);vMS();
$('ml').innerHTML=list.map(s=>`<div class=item id="r_${s.id}"><div class=av id="a_${s.id}" style="background:${col(s.name)}">${ini(s.name)}</div><div class=nm>${esc(s.name)}<small>#${sr(s)} · Roll ${esc(s.roll||'-')}</small></div><input class=mi type=number inputmode=decimal placeholder="-" value="${x.marks[s.id]==null?'':x.marks[s.id]}" oninput="setM('${s.id}',this.value)"><span class=bd id="b_${s.id}"></span></div>`).join('')||'<p class=empty>No students in this batch.</p>';
list.forEach(s=>bdg(x,s.id));hl(x)}
function ranksB(x){return ranks(x,F.mk.bat)}
function vTP(x){const r=ranksB(x),t=fs(F.mk.bat).filter(s=>r[s.id]<=3).sort((p,q)=>r[p.id]-r[q.id]),o=['','1st','2nd','3rd'];
$('tp').innerHTML=t.length?`<div class="card pod"><b>Top positions</b>${t.map(s=>`<div class=pr><span class="av rk${r[s.id]}">${r[s.id]}</span><div class=nm>${esc(s.name)}<small>${o[r[s.id]]} place · Roll ${esc(s.roll||'-')}</small></div><b>${x.marks[s.id]}/${x.total}</b></div>`).join('')}</div>`:''}
function hl(x){const r=ranksB(x);fs(F.mk.bat).forEach(s=>{const e=$('a_'+s.id),w=$('r_'+s.id);if(!e)return;const k=r[s.id];if(k&&k<=3){e.textContent=k;e.className='av rk'+k;e.removeAttribute('style');w.classList.add('top')}else{e.textContent=ini(s.name);e.className='av';e.setAttribute('style','background:'+col(s.name));w.classList.remove('top')}})}
function bdg(x,id){const e=$('b_'+id);if(!e)return;const t=stat(x,x.marks[id]);e.textContent=t;e.className='bd '+(bcls[t]||'')}
function vMS(){const x=S.exams.find(e=>e.id===F.mk.ex),l=fs(F.mk.bat);let p=0,f=0;l.forEach(s=>{const t=stat(x,x.marks[s.id]);if(t==='Pass')p++;if(t==='Fail')f++});
$('ms').innerHTML=`<div class=stats><div class="st g"><b>${p}</b>Passed</div><div class="st r"><b>${f}</b>Failed</div><div class=st><b>${l.length-p-f}</b>Pending</div></div>`;vTP(x)}
function setM(id,v){const x=S.exams.find(e=>e.id===F.mk.ex),n=parseFloat(v);if(v===''||isNaN(n))delete x.marks[id];else x.marks[id]=n;save();bdg(x,id);vMS();hl(x)}
function setEx(k,v){const x=S.exams.find(e=>e.id===F.mk.ex);if(k==='title'||k==='course')x[k]=v.trim()||x[k];else x[k]=Math.max(0,parseFloat(v)||0);save();vML()}
function delEx(){if(pend!=='x'){pend='x';vExam();setTimeout(()=>{if(pend==='x'){pend=null;if(tab==='mk'&&F.mk.ex)vExam()}},3000);return}
S.exams=S.exams.filter(e=>e.id!==F.mk.ex);F.mk.ex=null;pend=null;save();vMk()}

/* ---- Marksheets ---- */
const ord=n=>n+(n%100>=11&&n%100<=13?'th':(['th','st','nd','rd'][n%10]||'th'));
async function savePdf(d,name){try{const dl=window.claude&&await claude.use('downloads');if(dl){await dl.save({filename:name,data:d.output('blob')});toast('PDF ready')}else d.save(name)}catch(e){if(!e||e.code!=='declined')toast('Could not save PDF')}}
const NAVY=[20,48,95],ORG=[232,133,26];
function fit(d,s,w){s=String(s==null?'':s);let c=0;while(s.length>1&&d.getTextWidth(s)>w){s=s.slice(0,-1);c=1}return c?s.slice(0,-1)+'..':s}
function pdfHead(d,title){d.setFillColor(...NAVY);d.rect(0,0,210,34,'F');d.setFillColor(...ORG);d.rect(0,34,210,1.6,'F');
try{d.setFillColor(250,248,245);d.roundedRect(14,6,22,22,3,3,'F');d.addImage(LOGO,'JPEG',15,7,20,20)}catch(e){}
d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(15);d.text('Worldwide Computer & English Language Centre',42,16);
d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(200,212,235);d.text('Pir Jo Goth',42,23);
d.setTextColor(...NAVY);d.setFont('helvetica','bold');d.setFontSize(13);d.text(title.toUpperCase(),105,46,{align:'center'});
d.setDrawColor(...ORG);d.setLineWidth(.6);d.line(85,49,125,49);return 56}
function infoBox(d,y,L,R){d.setFillColor(244,246,250);d.setDrawColor(210,216,228);d.setLineWidth(.3);d.roundedRect(14,y,182,32,2,2,'FD');
[[L,19,45,62],[R,110,138,56]].forEach(([a,lx,vx,mw])=>a.forEach((r,i)=>{const yy=y+9+i*9;d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(110,120,135);d.text(r[0],lx,yy);d.setFont('helvetica','bold');d.setFontSize(10.5);d.setTextColor(25,35,50);{let z=10.5;while(z>8.5&&d.getTextWidth(String(r[1]))>mw){z-=.5;d.setFontSize(z)}d.text(fit(d,r[1],mw),vx,yy)}}));return y+32}
function wrapTxt(d,s,w){const out=[];let cur='';const push=()=>{if(cur)out.push(cur);cur=''};
for(const word of s.split(' ')){let wd=word;
while(d.getTextWidth(wd)>w){let k=wd.length-1;while(k>1&&d.getTextWidth(wd.slice(0,k))>w)k--;push();out.push(wd.slice(0,k));wd=wd.slice(k)}
const t=cur?cur+' '+wd:wd;if(d.getTextWidth(t)<=w)cur=t;else{push();cur=wd}}
push();return out.length?out:['']}
function table2(d,y,cols,rows){const X=[];let x=14;cols.forEach(c=>{X.push(x);x+=c.w});
const put=(c,i,t,yy)=>d.text(String(t),c.a==='c'?X[i]+c.w/2:X[i]+2.5,yy,{align:c.a==='c'?'center':'left'});
const head=yy=>{d.setFillColor(...NAVY);d.rect(14,yy,182,8,'F');d.setTextColor(255,255,255);d.setFont('helvetica','bold');d.setFontSize(8.5);cols.forEach((c,i)=>put(c,i,c.h,yy+5.4));return yy+8};
y=head(y);
if(!rows.length){d.setFont('helvetica','normal');d.setFontSize(9.5);d.setTextColor(110,120,135);d.text('No tests attempted yet.',105,y+7,{align:'center'});return y+12}
rows.forEach((r,ri)=>{d.setFont('helvetica','normal');d.setFontSize(9.5);
const cells=r.map((v,i)=>cols[i].wrap?wrapTxt(d,String(v==null?'':v),cols[i].w-5).slice(0,3):[String(v==null?'':v)]);
const h=Math.max(8.4,Math.max(...cells.map(c=>c.length))*4.4+4);
if(y+h>270){d.addPage();y=head(16)}
if(ri%2){d.setFillColor(247,248,251);d.rect(14,y,182,h,'F')}
cells.forEach((ls,i)=>{const c=cols[i];let col=[25,35,50],b='normal';
if(c.st){b='bold';col=ls[0]==='Pass'?[26,138,74]:ls[0]==='Fail'?[201,58,58]:[200,120,20]}
if(c.cf){const z=c.cf(ls[0]);if(z){col=z;b='bold'}}
d.setFont('helvetica',b);d.setTextColor(...col);ls.forEach((t,k)=>put(c,i,t,y+5.6+k*4.4))});
d.setDrawColor(222,227,236);d.setLineWidth(.2);d.line(14,y+h,196,y+h);y+=h});
d.setDrawColor(...NAVY);d.setLineWidth(.5);d.line(14,y,196,y);return y}
function tiles(d,y,it){const w=(182-8)/3;it.forEach((t,i)=>{const x=14+i*(w+4);d.setFillColor(244,246,250);d.setDrawColor(210,216,228);d.setLineWidth(.3);d.roundedRect(x,y,w,20,2,2,'FD');
d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(110,120,135);d.text(t.l,x+w/2,y+7,{align:'center'});
d.setFont('helvetica','bold');d.setFontSize(15);d.setTextColor(...(t.c||NAVY));d.text(String(t.v),x+w/2,y+16,{align:'center'})});return y+20}
function sign(d,y){y=Math.max(y+24,252);if(y>272){d.addPage();y=60}d.setDrawColor(120,130,145);d.setLineWidth(.3);d.line(14,y,72,y);d.line(138,y,196,y);
d.setFont('helvetica','normal');d.setFontSize(8.5);d.setTextColor(90,100,115);d.text("Teacher's Signature",43,y+5,{align:'center'});d.text("Principal's Signature",167,y+5,{align:'center'})}
function foot(d){const n=d.getNumberOfPages();for(let i=1;i<=n;i++){d.setPage(i);d.setFont('helvetica','normal');d.setFontSize(7.5);d.setTextColor(140,148,160);d.text('Generated on '+today(),14,290);d.text('Page '+i+' of '+n,196,290,{align:'right'})}}
function sheet(id){const s=S.students.find(z=>z.id===id);if(!s)return null;
const rows=S.exams.filter(x=>x.marks[id]!=null).sort((p,q)=>p.course.localeCompare(q.course)).map(x=>({x,v:x.marks[id],t:stat(x,x.marks[id]),r:ranks(x,s.batch)[id]}));
const to=rows.reduce((a,o)=>a+o.x.total,0),ob=rows.reduce((a,o)=>a+o.v,0);
return{s,rows,to,ob,pc:to?Math.round(ob/to*1000)/10:0,ps:rows.filter(o=>o.t==='Pass').length,n:rows.length}}
function openSt(){const v=$('sst').value;if(!v)return toast('Select a student');F.mk.st=v;vMk();scrollTo(0,0)}
function vSheet(){const d=sheet(F.mk.st);if(!d){F.mk.st=null;return vMk()}
$('main').innerHTML=`<button class=sec onclick="F.mk.st=null;vMk()">‹ Back</button><div class=card style="margin-top:10px"><b>${esc(d.s.name)}</b><span class=hint> · ${esc(d.s.batch)}</span><p class=hint style="margin:4px 0 0">Roll ${esc(d.s.roll||'-')} · Serial #${sr(d.s)}${d.s.father?' · Father: '+esc(d.s.father):''}</p></div>
<div class=stats><div class=st><b>${d.ob}/${d.to}</b>Marks</div><div class="st g"><b>${d.pc}%</b>Percentage</div><div class=st><b>${d.ps}/${d.n}</b>Passed</div></div>
<div class=card><div class=tw><table><tr><th>Course</th><th>Exam</th><th class=r>Total</th><th class=r>Pass</th><th class=r>Got</th><th>Pos</th><th></th></tr>${d.rows.map(o=>`<tr><td>${esc(o.x.course)}</td><td>${esc(o.x.title)}</td><td class=r>${o.x.total}</td><td class=r>${o.x.pass}</td><td class=r>${o.v==null?'-':o.v}</td><td>${o.r?ord(o.r):'-'}</td><td><span class="bd ${bcls[o.t]||''}">${o.t||'-'}</span></td></tr>`).join('')||'<tr><td colspan=7>No exams yet.</td></tr>'}</table></div></div>
<button class=pri onclick="stuPdf()">Download marksheet PDF</button>`}
async function stuPdf(){const d=sheet(F.mk.st);if(!d||!window.jspdf)return toast('PDF library did not load');
const p=new window.jspdf.jsPDF();let y=pdfHead(p,'Student Marksheet');
y=infoBox(p,y,[['Name',d.s.name],["Father's Name",d.s.father||'-'],['Roll No',d.s.roll||'-']],[['Batch',d.s.batch],['Serial No',sr(d.s)],['Date',today()]]);
y=table2(p,y+6,[{h:'#',w:9,a:'c'},{h:'Course',w:38,wrap:1},{h:'Test',w:42,wrap:1},{h:'Total',w:18,a:'c'},{h:'Passing',w:19,a:'c'},{h:'Obtained',w:21,a:'c'},{h:'Position',w:17,a:'c'},{h:'Status',w:18,a:'c',st:1}],d.rows.map((o,i)=>[i+1,o.x.course,o.x.title,o.x.total,o.x.pass,o.v,o.r?ord(o.r):'-',o.t]));
y=tiles(p,y+8,[{l:'TOTAL MARKS',v:d.ob+' / '+d.to},{l:'PERCENTAGE',v:d.pc+'%'},{l:'TESTS PASSED',v:d.ps+' of '+d.n,c:[26,138,74]}]);
sign(p,y);foot(p);await savePdf(p,`Marksheet-${d.s.name}-${d.s.batch}.pdf`.replace(/\s+/g,'_'))}
async function resPdf(){const x=S.exams.find(e=>e.id===F.mk.ex),b=F.mk.bat;if(!x||!b)return toast('Choose a batch first');if(!window.jspdf)return toast('PDF library did not load');
const r=ranks(x,b),l=fs(b).sort((p,q)=>(x.marks[q.id]??-1)-(x.marks[p.id]??-1));
const p=new window.jspdf.jsPDF();let y=pdfHead(p,'Result Sheet');
y=infoBox(p,y,[['Batch',b],['Course',x.course],['Test',x.title]],[['Total Marks',x.total],['Passing Marks',x.pass],['Date',today()]]);
y=table2(p,y+6,[{h:'Pos',w:14,a:'c'},{h:'Roll',w:18,a:'c'},{h:'Name',w:54,wrap:1},{h:"Father's Name",w:52,wrap:1},{h:'Obtained',w:24,a:'c'},{h:'Status',w:20,a:'c',st:1}],l.map(s=>[r[s.id]?ord(r[s.id]):'-',s.roll||'-',s.name,s.father||'-',x.marks[s.id]==null?'-':x.marks[s.id],stat(x,x.marks[s.id])||'Pending']));
const ps=l.filter(s=>stat(x,x.marks[s.id])==='Pass').length,fl=l.filter(s=>stat(x,x.marks[s.id])==='Fail').length;
y=tiles(p,y+8,[{l:'PASSED',v:ps,c:[26,138,74]},{l:'FAILED',v:fl,c:[201,58,58]},{l:'PENDING',v:l.length-ps-fl}]);
sign(p,y);foot(p);await savePdf(p,`Result-${b}-${x.course}-${x.title}.pdf`.replace(/\s+/g,'_'))}

/* ---- Backup ---- */
const bk=()=>{const d=S.lastBackup?(new Date(today())-new Date(S.lastBackup))/864e5:99;return d>=7&&S.students.length?`<div class=warn onclick="go('set')">${S.lastBackup?'Last backup was '+Math.floor(d)+' days ago':'No backup taken yet'}. Tap here to back up your data.</div>`:''};
const bkCard=()=>`<div class=card><b>Backup &amp; Restore</b><p class=hint>${S.lastBackup?'Last backup: '+esc(S.lastBackup)+'.':'No backup taken yet.'} Your data is stored on this device only, so download a backup regularly and keep it safe (WhatsApp, email or Drive).</p><div class=row><button class=pri onclick="backup()">Download backup</button><button class=sec onclick="$('rf').click()">Restore</button></div><input id=rf type=file accept=".json,application/json" hidden onchange="restore(this)">${PR?`<div class=warn style="cursor:default;margin:10px 0 0">Backup file has ${PR.students.length} students and ${Object.keys(PR.att).length} attendance days. Replace current data?<div class=row style="margin-top:8px"><button class=dng onclick="applyR()">Replace</button><button class=sec onclick="PR=null;vSet()">Cancel</button></div></div>`:''}</div>`;
async function backup(){const name=`WWC-backup-${today()}.json`,data=JSON.stringify({...S,lastBackup:today()});
try{const dl=window.claude&&await claude.use('downloads');if(dl)await dl.save({filename:name,data});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click()}
S.lastBackup=today();save();toast('Backup saved');vSet()}catch(e){if(!e||e.code!=='declined')toast('Could not save backup')}}
function restore(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.students)||!Array.isArray(d.batches)||!d.att)throw 0;PR=d;vSet()}catch(e){toast('Not a valid backup file')}inp.value=''};r.readAsText(f)}
function applyR(){S=Object.assign({batches:[],students:[],att:{},courses:{},exams:[],v:2},PR);PR=null;save();toast('Backup restored');vSet()}
function addItem(k){const v=$('n_'+k).value.trim();if(!v||S[k].includes(v))return;S[k].push(v);save();vSet()}
function delItem(k,i){const key=k+i,name=S[k][i],f='batch';
if(S.students.some(s=>s[f]===name))return toast('In use by students - move or delete them first');
if(pend!==key){pend=key;vSet();setTimeout(()=>{if(pend===key){pend=null;vSet()}},3000);return}
S[k].splice(i,1);pend=null;save();vSet()}
render();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script></body></html>
